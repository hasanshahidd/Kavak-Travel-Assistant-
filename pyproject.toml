[project]
name = "kavak-travel-assistant"
version = "0.1.0"
description = "Conversational travel assistant - flight search, RAG-backed visa/refund Q&A."
authors = [{ name = "Hassan" }]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".faiss_index", "evals/results", ".eval_cache", ".traces"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"evals/*" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false  # third-party SDK stubs vary between versions
exclude = ["evals/results", ".faiss_index", ".traces"]

# Third-party libraries with shifting type stubs - treat as untyped at the boundary.
[[tool.mypy.overrides]]
module = ["langgraph.*", "anthropic.*", "instructor.*", "yaml"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
